<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2090" viewBox="0 0 640 2090" role="img" aria-labelledby="t d"><title id="t">Bark, skin, motion, location, temperature, vital, pressure, light and combined reporting interfaces. Availability varies by configured input and implementation.</title><desc id="d">Concept interface artwork, not an application screenshot, live measurement or veterinary diagnosis.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="212" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-0.0s"><g transform="translate(46 34) scale(0.8636363636363636)"><path d="M6 17h8l11-9v28l-11-9H6zM31 14q11 8 0 16M35 8q18 14 0 28" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="62" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">BarkSense AI</text><text x="48" y="123" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Audio capture, bark-processing helpers</text><text x="48" y="157" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">and emotion-history interfaces.</text><rect x="24" y="242" width="592" height="212" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-0.8s"><g transform="translate(46 264) scale(0.8636363636363636)"><path d="M5 9h34v27H5zM12 25l7-10 8 13 6-7M30 16h1" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="292" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">SkinSense AI</text><text x="48" y="353" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Image uploads, analysis helpers, scan</text><text x="48" y="387" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">history and comparison views.</text><rect x="24" y="472" width="592" height="212" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-1.6s"><g transform="translate(46 494) scale(0.8636363636363636)"><path d="M5 33l11-24 10 25 13-23M3 41h38" fill="none" stroke="#F3D962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="522" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">MotionSense AI</text><text x="48" y="583" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Movement and activity presentation with</text><text x="48" y="617" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">collar-data workflows.</text><rect x="24" y="702" width="592" height="212" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-2.4000000000000004s"><g transform="translate(46 724) scale(0.8636363636363636)"><path d="M22 3a13 13 0 0 1 13 13c0 10-13 25-13 25S9 26 9 16A13 13 0 0 1 22 3zM22 11a5 5 0 1 0 0 10a5 5 0 1 0 0-10" fill="none" stroke="#A783F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="752" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">LocationSense AI</text><text x="48" y="813" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Map, location-history and safe-zone</text><text x="48" y="847" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">interface workflows.</text><rect x="24" y="932" width="592" height="212" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-3.2s"><g transform="translate(46 954) scale(0.8636363636363636)"><path d="M17 7a5 5 0 0 1 10 0v19a9 9 0 1 1-10 0zM22 14v18" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="982" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">TemperatureSense AI</text><text x="48" y="1043" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Temperature-related views; displayed</text><text x="48" y="1077" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">values need a verified data source.</text><rect x="24" y="1162" width="592" height="212" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-4.0s"><g transform="translate(46 1184) scale(0.8636363636363636)"><path d="M2 23h9l4-7 5 17 5-28 6 26 4-8h8" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="1212" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">VitalSense AI</text><text x="48" y="1273" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Heart-rate and respiratory-trend</text><text x="48" y="1307" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">presentation interfaces.</text><rect x="24" y="1392" width="592" height="212" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-4.800000000000001s"><g transform="translate(46 1414) scale(0.8636363636363636)"><path d="M5 32a18 18 0 1 1 34 0M9 32h26M22 28l10-13" fill="none" stroke="#F3D962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="1442" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">PressureSense AI</text><text x="48" y="1503" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Pressure-related charts and interface</text><text x="48" y="1537" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">summaries.</text><rect x="24" y="1622" width="592" height="212" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-5.6000000000000005s"><g transform="translate(46 1644) scale(0.8636363636363636)"><path d="M15 29a12 12 0 1 1 15 0v7H15zM16 41h13M22 2V0M3 15l-3-2M41 15l3-2" fill="none" stroke="#A783F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="1672" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">LightSense AI</text><text x="48" y="1733" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Ambient-light and UV-related interface</text><text x="48" y="1767" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">views.</text><rect x="24" y="1852" width="592" height="212" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-6.4s"><g transform="translate(46 1874) scale(0.8636363636363636)"><path d="M7 3h22l9 10v28H7zM28 3v11h10M13 23h18M13 31h15" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="1902" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">CombineSense AI</text><text x="48" y="1963" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Combined overview and</text><text x="48" y="1997" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">PDF-report-generation workflows.</text></svg>