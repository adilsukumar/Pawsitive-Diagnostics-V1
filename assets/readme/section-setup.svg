<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="166" viewBox="0 0 1120 166" role="img" aria-labelledby="t d"><title id="t">OPEN THE WORKSPACE. Repository-specific setup and the current environment keys.</title><desc id="d">Concept interface artwork, not an application screenshot, live measurement or veterinary diagnosis.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M28 12H1092" fill="none" stroke="#363348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(30 40) scale(0.9090909090909091)"><path d="M4 7h36v31H4zM11 16l8 7-8 7M26 30h8" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="94" y="72" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="29" font-weight="600" text-anchor="start">OPEN THE WORKSPACE</text><text x="32" y="128" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Repository-specific setup and the current environment keys.</text><circle class="glow" cx="1088" cy="146" r="4" fill="#F3D962"/></svg>