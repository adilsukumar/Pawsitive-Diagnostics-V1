<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-labelledby="t d"><title id="t">Hardware files. KiCad source and Gerber exports</title><desc id="d">Concept interface artwork, not an application screenshot, live measurement or veterinary diagnosis.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="145" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(22 24) scale(0.8636363636363636)"><path d="M4 5h36v28H4zM22 33v9M12 42h20M11 24l7-8 8 5 7-10" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="78" y="51" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="600" text-anchor="start">Hardware files</text><text x="22" y="115" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">KiCad source and Gerber exports</text></svg>