<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1248" viewBox="0 0 1120 1248" role="img" aria-labelledby="t d"><title id="t">Bark, skin, motion, location, temperature, vital, pressure, light and combined reporting interfaces. Availability varies by configured input and implementation.</title><desc id="d">Concept interface artwork, not an application screenshot, live measurement or veterinary diagnosis.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="524" height="225" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-0.0s"><g transform="translate(46 34) scale(0.8636363636363636)"><path d="M6 17h8l11-9v28l-11-9H6zM31 14q11 8 0 16M35 8q18 14 0 28" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="62" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">BarkSense AI</text><text x="48" y="123" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Audio capture, bark-processing</text><text x="48" y="157" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">helpers and emotion-history</text><text x="48" y="191" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">interfaces.</text><rect x="572" y="12" width="524" height="225" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-0.8s"><g transform="translate(594 34) scale(0.8636363636363636)"><path d="M5 9h34v27H5zM12 25l7-10 8 13 6-7M30 16h1" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="650" y="62" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">SkinSense AI</text><text x="596" y="123" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Image uploads, analysis helpers,</text><text x="596" y="157" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">scan history and comparison views.</text><rect x="24" y="257" width="524" height="225" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-1.6s"><g transform="translate(46 279) scale(0.8636363636363636)"><path d="M5 33l11-24 10 25 13-23M3 41h38" fill="none" stroke="#F3D962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="307" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">MotionSense AI</text><text x="48" y="368" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Movement and activity presentation</text><text x="48" y="402" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">with collar-data workflows.</text><rect x=