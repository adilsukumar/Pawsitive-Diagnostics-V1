20" stroke="#363348"/><g class="respond" style="animation-delay:-4.0s"><g transform="translate(594 524) scale(0.8636363636363636)"><path d="M2 23h9l4-7 5 17 5-28 6 26 4-8h8" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="650" y="552" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">VitalSense AI</text><text x="596" y="613" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Heart-rate and respiratory-trend</text><text x="596" y="647" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">presentation interfaces.</text><rect x="24" y="747" width="524" height="225" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-4.800000000000001s"><g transform="translate(46 769) scale(0.8636363636363636)"><path d="M5 32a18 18 0 1 1 34 0M9 32h26M22 28l10-13" fill="none" stroke="#F3D962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="797" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">PressureSense AI</text><text x="48" y="858" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Pressure-related charts and</text><text x="48" y="892" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">interface summaries.</text><rect x="572" y="747" width="524" height="225" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-5.6000000000000005s"><g transform="translate(594 769) scale(0.8636363636363636)"><path d="M15 29a12 12 0 1 1 15 0v7H15zM16 41h13M22 2V0M3 15l-3-2M41 15l3-2" fill="none" stroke="#A783F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="650" y="797" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">LightSense AI</text><text x="596" y="858" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Ambient-light and UV-related</text><text x="596" y="892" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">interface views.</text><rect x="24" y="992" width="1072" height="225" rx="14" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-6.4s"><g transform="translate(46 1014) scale(0.8636363636363636)"><path d="M7 3h22l9 10v28H7zM28 3v11h10M13 23h18M13 31h15" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="1042" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">CombineSense AI</text><text x="48" y="1103" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Combined overview and PDF-report-generation workflows.</text></svg>