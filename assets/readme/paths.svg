<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="334" viewBox="0 0 1120 334" role="img" aria-labelledby="t d"><title id="t">Collar data, cloud records and prototype fallbacks have different sources. Connected UI state alone is not measurement validation.</title><desc id="d">Concept interface artwork, not an application screenshot, live measurement or veterinary diagnosis.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="342" height="300" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(46 34) scale(0.8636363636363636)"><path d="M21 2l14 12-25 20M21 42l14-12L10 10M21 2v40" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="46" y="106" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">COLLAR PATH</text><text x="46" y="157" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Web Bluetooth</text><text x="46" y="191" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">notifications are</text><text x="46" y="225" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">parsed into</text><text x="46" y="259" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">application readings.</text><rect x="389" y="12" width="342" height="300" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(411 34) scale(0.8636363636363636)"><path d="M10 33a10 10 0 0 1-1-20A13 13 0 0 1 34 13a10 10 0 0 1 0 20M22 20v21M16 35l6 6 6-6" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="411" y="106" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">CLOUD PATH</text><text x="411" y="157" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Supabase stores and</text><text x="411" y="191" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">streams</text><text x="411" y="225" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">sensor_readings</text><text x="411" y="259" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">records.</text><rect x="754" y="12" width="342" height="300" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(776 34) scale(0.8636363636363636)"><path d="M5 6h33v33H5zM12 22l7 7 13-15" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="776" y="106" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">PROTOTYPE PATH</text><text x="776" y="157" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Demo values, fixed</text><text x="776" y="191" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">responses and model</text><text x="776" y="225" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">fallbacks require</text><text x="776" y="259" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">separate</text><text x="776" y="293" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">interpretation.</text></svg>