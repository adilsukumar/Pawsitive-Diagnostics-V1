<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1155" viewBox="0 0 1120 1155" role="img" aria-labelledby="t d"><title id="t">Pawsitive Diagnostics V1. A closer look at everyday care. Animated concept mobile interface.</title><desc id="d">Concept interface artwork, not an application screenshot, live measurement or veterinary diagnosis.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M30 27H1090" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="72" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">PAWSITIVE INNOVATORS / ADIL SUKUMAR</text><text x="26" y="255" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="136" font-weight="700" text-anchor="start">PAWSITIVE</text><text x="30" y="356" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="91" font-weight="600" text-anchor="start">DIAGNOSTICS</text><text x="32" y="473" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="72" font-weight="600" text-anchor="start">A closer look</text><text x="32" y="556" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="65" font-weight="600" text-anchor="start">at everyday care.</text><text x="32" y="640" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">A mobile-first pet-care interface with</text><text x="32" y="674" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">device, cloud, media and report workflows.</text><g transform="translate(767 548) scale(0.92)"><g class="care"><rect x="0" y="0" width="275" height="439" rx="30" fill="#11151F" stroke="#A783F7"/><path d="M104 18h67" fill="none" stroke="#363348" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="22" y="65" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">PAWSITIVE</text><rect x="18" y="85" width="239" height="92" rx="12" fill="#191726" stroke="#363348"/><text x="36" y="118" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">YOUR PET / YOUR SPACE</text><path d="M38 148h45l8-10 8 19 9-31 9 22h118" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="18" y="197" width="239" height="43" rx="10" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-0s"><g transform="translate(29 205) scale(0.6136363636363636)"><path d="M6 17h8l11-9v28l-11-9H6zM31 14q11 8 0 16M35 8q18 14 0 28" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="70" y="225" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">BARK</text><circle cx="235" cy="219" r="3" fill="#FF4081"/></g><rect x="18" y="251" width="239" height="43" rx="10" fill="#151420" stroke="#363348"/><g class="respond" style="animation-delay:-2s"><g transform="translat